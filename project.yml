name: speakerr
options:
  bundleIdPrefix: com.brimell
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"

targets:
  SpeakerrAudio:
    type: framework
    platform: macOS
    sources:
      - SpeakerrAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brimell.speakerr.audio
        PRODUCT_NAME: SpeakerrAudio
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        MACH_O_TYPE: staticlib
        CODE_SIGNING_ALLOWED: NO

  SpeakerrPresentation:
    type: framework
    platform: macOS
    sources:
      - SpeakerrPresentation
    dependencies:
      - target: SpeakerrAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brimell.speakerr.presentation
        PRODUCT_NAME: SpeakerrPresentation
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        MACH_O_TYPE: staticlib
        CODE_SIGNING_ALLOWED: NO

  speakerr-test:
    type: tool
    platform: macOS
    sources:
      - SpeakerrCLI
    dependencies:
      - target: SpeakerrAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brimell.speakerr.test
        PRODUCT_NAME: speakerr-test
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO

  SpeakerrAudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpeakerrTests
    dependencies:
      - target: SpeakerrAudio
      - target: SpeakerrPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brimell.speakerr.audio-tests
        PRODUCT_NAME: SpeakerrAudioTests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO

  speakerr:
    type: application
    platform: macOS
    sources:
      - speakerr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brimell.speakerr
        PRODUCT_NAME: speakerr
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: speakerr/Info.plist
        CODE_SIGN_ENTITLEMENTS: speakerr/speakerr.entitlements
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
    info:
      path: speakerr/Info.plist
      properties:
        CFBundleShortVersionString: 1.4.0
        CFBundleVersion: 5
        LSUIElement: true
        NSMicrophoneUsageDescription: speakerr needs audio input access to capture audio from BlackHole for EQ processing.
    entitlements:
      path: speakerr/speakerr.entitlements

schemes:
  speakerr:
    build:
      targets:
        speakerr: all
    run:
      config: Release
  speakerr-test:
    build:
      targets:
        speakerr-test: all
    run:
      config: Debug
  SpeakerrAudio:
    build:
      targets:
        SpeakerrAudio: all
        SpeakerrAudioTests: [test]
    test:
      targets:
        - SpeakerrAudioTests
